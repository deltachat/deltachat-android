name: Instrumented Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  instrumented-tests:
    name: Run instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: "r29"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: jni/deltachat-core-rust

      - name: Get deltachat-core-rust submodule hash
        id: core-hash
        run: echo "hash=$(git rev-parse HEAD:jni/deltachat-core-rust)" >> $GITHUB_OUTPUT

      - name: Restore compiled core (x86_64)
        id: core-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            jni/x86_64
            libs/x86_64
          key: core-x86_64-${{ steps.core-hash.outputs.hash }}-${{ hashFiles('jni/Android.mk', 'jni/Application.mk', 'jni/dc_wrapper.c', 'scripts/ndk-make.sh') }}-ndk-r29

      # Build before booting the emulator, so compile time doesn't count in test time
      - name: Build app and test APKs
        run: ./gradlew --no-daemon -PABI_FILTER=x86_64 -PnoMinify assembleFossDebug assembleFossDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew --no-daemon -PABI_FILTER=x86_64 -PnoMinify connectedFossDebugAndroidTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: build/outputs/connected_android_test_additional_output/fossDebugAndroidTest/connected/
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-report
          path: |
            build/reports/androidTests/connected/
            build/outputs/androidTest-results/connected/

  # FOR DEMO ONLY, will be removed
  screenshot-comment:
    name: Post screenshots to PR (demo)
    needs: instrumented-tests
    if: >-
      always() && needs.instrumented-tests.result != 'cancelled' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: ci-screenshots-branch
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      DEST: pr-${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci-screenshots
          path: ci-screenshots

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: screenshots
          path: shots

      - name: Commit screenshots to ci-screenshots branch
        run: |
          mkdir -p "ci-screenshots/$DEST"
          cp -r shots/. "ci-screenshots/$DEST/"
          cd ci-screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Screenshots for $DEST"
          git push

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEST_RESULT: ${{ needs.instrumented-tests.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'shots';
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/ci-screenshots/${process.env.DEST}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            function walk(dir) {
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap(e => {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) return walk(p);
                return e.name.endsWith('.png') ? [path.relative(root, p)] : [];
              });
            }

            const groups = {};
            for (const rel of walk(root)) {
              const dir = path.dirname(rel);
              (groups[dir] = groups[dir] || []).push(rel);
            }

            const url = rel => `${base}/${rel.split(path.sep).map(encodeURIComponent).join('/')}`;

            const label = f => {
              const name = path.basename(f, '.png');
              const m = name.match(/^(\d+)_(.*)$/);
              return m ? `${Number(m[1])}. ${m[2]}` : name;
            };

            let body = `### Screenshots\n\n`;
            for (const dir of Object.keys(groups).sort()) {
              const files = groups[dir].sort();
              body += `#### ${path.basename(dir)}\n\n<table>\n`;
              for (let i = 0; i < files.length; i += 2) {
                const pair = files.slice(i, i + 2);
                const names = pair.map(f => `<th>${label(f)}</th>`);
                const imgs = pair.map(f => `<td><img src="${url(f)}" width="300"></td>`);
                if (pair.length === 1) { names.push('<th></th>'); imgs.push('<td></td>'); }
                body += `<tr>${names.join('')}</tr>\n<tr>${imgs.join('')}</tr>\n`;
              }
              body += `</table>\n\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
