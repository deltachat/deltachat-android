plugins {
    id 'com.android.library'
}

// TGDELTA: Gradle 9 does not inherit the root project's `repositories` block
// into subprojects, so declare them here.
// Use standard repos on CI (google(), mavenCentral()), mirrors only on local machine
// where dl.google.com is sinkholed. Pass -PuseStandardRepos=true on CI.
def useStandardRepos = project.hasProperty('useStandardRepos') && project.useStandardRepos == 'true'
repositories {
    if (useStandardRepos) {
        google()
        mavenCentral()
    } else {
        maven {
            name = 'AliyunGoogle'
            url = 'https://maven.aliyun.com/repository/google'
        }
        maven {
            name = 'HuaweiMirror'
            url = 'https://mirrors.huaweicloud.com/repository/maven'
        }
        google()
        mavenCentral()
    }
}

// TGDELTA: this module vendors a forked androidx.recyclerview, so the real
// artifact must not be on any classpath here (appcompat pulls it in
// transitively). See the note above the dependencies block.
configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

android {
    // Must match the donor's namespace so that the generated R class is
    // org.telegram.messenger.R, which is what all vendored code imports.
    namespace 'org.telegram.messenger'
    // TGDELTA: 36, not 37. The android-37.0 platform jar available here is a
    // trimmed stub that omits android.hardware.fingerprint (and other APIs the
    // donor tree uses). android-36 contains them.
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        // Must match the app module (21) so the manifest merge succeeds.
        // android.hardware.fingerprint is API 23, but that is a *runtime* guard
        // in the donor code (@TargetApi(23)) and compiles fine against
        // compileSdk 36 regardless of minSdk.
        minSdkVersion 21
        targetSdkVersion 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += [
                'LICENSE.txt',
                'LICENSE',
                'NOTICE',
                'META-INF/LICENSE',
                'META-INF/NOTICE'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

// Report the full error surface instead of javac's default 100-error cap.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '20000']
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    // NOTE: androidx.recyclerview is NOT declared here. Telegram vendors a
    // forked copy in src/main/java/androidx/recyclerview/widget (39 files).
    // Declaring the real artifact too would put duplicate classes on the
    // classpath, and the fork must win because Telegram's UI calls fork-only
    // overloads (e.g. DefaultItemAnimator.animateRemove(holder, info)).
    // The fork is patched with the two AndroidX 1.2 aliases Delta Chat needs
    // (getBindingAdapterPosition / getAbsoluteAdapterPosition).
    implementation 'androidx.emoji2:emoji2-emojipicker:1.5.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'

    // ---------------------------------------------------------------------
    // TGDELTA: compile-only dependencies.
    //
    // The vendored Telegram tree references a large surface of out-of-scope
    // libraries (payments, push, ML, video transcoding, cast, ...). Under the
    // project brief none of these may ship. `compileOnly` puts them on the
    // javac classpath so the donor source compiles unchanged, while
    // contributing no classes and no native code to the APK.
    //
    // Verification that nothing leaks into the artifact:
    //   ./gradlew :tgui:assembleDebug
    //   unzip -l tgui/build/outputs/aar/tgui-debug.aar
    // and for the app: apkanalyzer files list <apk> | grep -iE '<name>'
    // ---------------------------------------------------------------------
    // Versions must match the donor's own TMessagesProj/build.gradle, otherwise
    // the vendored source targets APIs that no longer exist (e.g. stripe 20.x
    // replaced the 2.x `Stripe`/`TokenCallback` API the code uses).
    compileOnly 'androidx.exifinterface:exifinterface:1.3.6'
    compileOnly 'androidx.collection:collection:1.4.0'

    compileOnly 'com.google.android.gms:play-services-base:18.5.0'
    compileOnly 'com.google.android.gms:play-services-cast-framework:21.5.0'
    compileOnly 'com.google.android.gms:play-services-vision:20.1.3'
    compileOnly 'com.google.android.gms:play-services-location:21.3.0'
    compileOnly 'com.google.android.gms:play-services-maps:19.0.0'
    compileOnly 'com.google.android.gms:play-services-auth:21.2.0'
    compileOnly 'com.google.android.gms:play-services-wallet:19.4.0'
    compileOnly 'com.google.android.gms:play-services-wearable:18.1.0'
    compileOnly 'com.google.android.gms:play-services-safetynet:18.1.0'
    compileOnly 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    compileOnly 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    compileOnly 'com.google.android.play:integrity:1.4.0'

    compileOnly 'com.android.billingclient:billing:8.0.0'
    compileOnly 'com.google.firebase:firebase-messaging:22.0.0'
    compileOnly 'com.google.firebase:firebase-datatransport:18.1.0'
    compileOnly 'com.google.firebase:firebase-appindexing:20.0.0'
    compileOnly 'com.google.mlkit:language-id:17.0.6'

    compileOnly 'com.stripe:stripe-android:2.0.2'   // donor pins 2.x
    compileOnly 'com.googlecode.mp4parser:isoparser:1.1.22'
    compileOnly 'org.commonmark:commonmark:0.21.0'
    compileOnly 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    compileOnly 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    compileOnly 'org.checkerframework:checker-qual:3.42.0'
    compileOnly 'org.aspectj:aspectjrt:1.9.21'
    compileOnly 'org.nanohttpd:nanohttpd:2.3.1'

    // NOTE: the donor does not use upstream androidx.media3 -- it builds forked
    // modules from TMessagesProj_Modules/media3 (exoplayer/dash/hls/session/
    // decoder-ffmpeg). Those submodules are empty in this checkout. Upstream
    // media3 is used here as the closest available substitute, which is why a
    // few fork-only APIs (VideoListener, SurfaceNotValidException,
    // setWorkerQueue, MediaCodecUtil.isHardwareAccelerated) still fail to
    // resolve. See docs/phase2-a3.md.
    compileOnly 'androidx.media3:media3-exoplayer:1.8.0'
    compileOnly 'androidx.media3:media3-exoplayer-hls:1.8.0'
    compileOnly 'androidx.media3:media3-exoplayer-dash:1.8.0'
    compileOnly 'androidx.media3:media3-session:1.8.0'
    compileOnly 'androidx.media3:media3-extractor:1.8.0'

    compileOnly 'androidx.mediarouter:mediarouter:1.7.0'
    compileOnly 'androidx.webkit:webkit:1.14.0'
    compileOnly 'androidx.car.app:app:1.4.0'
    compileOnly 'androidx.credentials:credentials:1.3.0'
    compileOnly 'androidx.biometric:biometric:1.1.0'
    compileOnly 'androidx.palette:palette:1.0.0'

    compileOnly 'io.noties.markwon:core:4.6.2'
    compileOnly 'io.noties.markwon:ext-latex:4.6.2'
    compileOnly 'io.noties.markwon:ext-tables:4.6.2'
    compileOnly 'io.noties.markwon:html:4.6.2'
    compileOnly 'io.noties.markwon:inline-parser:4.6.2'

    compileOnly 'com.google.zxing:core:3.5.3'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.google.android.recaptcha:recaptcha:18.6.1'
    compileOnly 'com.neovisionaries:nv-websocket-client:2.14'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // TGDELTA: the app module already ships im.conversations.webrtc:webrtc-android
    // (libwebrtc.jar, 163 org.webrtc classes). The vendored fork in
    // src/main/java/org/webrtc was reduced to its 10 fork-only classes
    // (voiceengine/*, TextureViewRenderer, OrientationHelper, Dav1dDecoder,
    // LegacyAudioDeviceModule); the 163 duplicates were deleted to stop R8
    // failing with "defined multiple times". compileOnly because the runtime
    // classes come from the app module's own implementation dependency.
    compileOnly 'im.conversations.webrtc:webrtc-android:129.0.0'
}
